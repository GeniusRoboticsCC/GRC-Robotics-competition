<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRC Schedule">
<title>GRC Match Schedule</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  :root { --u: 10px; }
  body { overflow-x: hidden; }
  body.idle { cursor: none; }

  .board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: calc(14px + var(--safe-t)) 16px calc(16px + var(--safe-b)); max-width: 1600px; margin: 0 auto; }

  /* ---------- header ---------- */
  .d-head { display: flex; align-items: center; gap: 12px 14px; flex-wrap: wrap; }
  .d-logo { width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 6px 22px rgba(255, 204, 47, .3)); }
  .d-titles { flex: 1 1 220px; min-width: 0; }
  .d-titles .eyebrow { font-size: 12px; }
  .d-title { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; }
  .d-title span { color: var(--gold); }
  .now-card {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 16px; border-radius: 16px; text-decoration: none;
    background: linear-gradient(160deg, #10285a, #0a1a3b); border: 1px solid var(--line);
  }
  .now-card small { display: block; font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .now-card .nm { display: block; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; }
  .now-card .ck { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; padding-left: 14px; border-left: 1px solid var(--line); }
  .now-card.running { border-color: rgba(41, 199, 132, .6); }
  .now-card.danger .ck { color: var(--red); }
  .now-card.done .ck { color: #ff8a96; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .3; } }

  /* "Watch live" (shown while staff have the YouTube stream switched on) */
  .watch-live { background: var(--red); border-color: #ff8a96; color: #fff; box-shadow: 0 8px 22px -10px rgba(255, 87, 103, .8); }
  .watch-live::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: blink 1.2s steps(2, start) infinite; }

  /* ---------- team finder ---------- */
  .finder { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: rgba(15, 35, 75, .6); border: 1px solid var(--line); }
  .finder label { font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
  .finder select { width: auto; min-width: 220px; flex: 0 1 300px; min-height: 42px; padding: 8px 12px; }
  .finder .summary { flex: 1 1 260px; min-width: 0; font-size: 13px; color: #c7d6ef; }
  .finder .summary b { color: #fff; }
  .finder .clear { flex: 0 0 auto; }

  /* ---------- schedule grid ---------- */
  .sched { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 640px) { .sched { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .mcard {
    position: relative; min-width: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px; border-radius: 16px;
    background: linear-gradient(150deg, rgba(23, 49, 98, .9), rgba(10, 24, 52, .94));
    border: 1px solid var(--line);
    transition: opacity .3s, border-color .3s, box-shadow .3s;
  }
  .mc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mc-no { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  .mc-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; background: #183460; color: #b3c6e6; }
  .mc-pill .t { font-variant-numeric: tabular-nums; }

  .mc-teams { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mc-team {
    display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 10px; background: rgba(6, 18, 42, .55); border: 1px solid transparent;
  }
  .mc-col { min-width: 5.8em; font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
  .mc-name { font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc-pts { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; }
  .mc-team.win { background: linear-gradient(90deg, rgba(255, 204, 47, .2), rgba(6, 18, 42, .55) 75%); }
  .mc-team.win .mc-pts { color: var(--gold); }
  .mc-team.win .mc-pts::after { content: ' ★'; font-size: .6em; vertical-align: .25em; }
  .mc-team.me { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }

  /* states */
  .mcard.final .mc-pill { background: rgba(41, 199, 132, .16); color: #8ff0c2; }
  .mcard.extra .mc-no { color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* judges' extra matches, e.g. "Final" */
  .mc-head { min-width: 0; }
  /* live +/− scoring: running points in pink until the result is saved as final */
  .mcard.scoring .mc-pill { background: rgba(255, 87, 103, .2); color: #ffb3bd; }
  .mc-team.lv .mc-pts { color: #ffb3bd; }
  .mcard.next { border-style: dashed; border-color: #4a7bd0; }
  .mcard.next .mc-pill { background: rgba(68, 140, 255, .18); color: #a9c8ff; }
  .mcard.live { border: 2px solid var(--gold); box-shadow: 0 0 0 1px rgba(255, 204, 47, .25), 0 0 46px -10px rgba(255, 204, 47, .6); }
  .mcard.live .mc-pill { background: var(--gold); color: var(--gold-ink); }
  .mcard.live[data-phase="live"] .mc-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: livepulse 1.6s infinite; }
  .mcard.awaiting .mc-pill { background: rgba(255, 120, 80, .9); color: #2a0b02; }
  .mcard.dim { opacity: .28; }
  .mcard.flash { animation: cardflash 2.4s ease-out; }
  @keyframes cardflash { 0%, 30% { box-shadow: 0 0 0 3px var(--gold), 0 0 50px rgba(255, 204, 47, .7); } }

  /* ---------- footer ---------- */
  .d-foot { display: grid; gap: 10px; }
  .progress { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 800; color: #c4d4ee; }
  .bar { flex: 1; height: 10px; border-radius: 99px; background: #132a52; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gold), #ffe27a); transition: width .8s ease; }
  .foot-row { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; align-items: center; }
  .foot-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .event-line { font-size: 12px; color: var(--muted-2); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  .fab { position: fixed; right: 16px; bottom: calc(16px + var(--safe-b)); z-index: 20; display: flex; gap: 8px; transition: opacity .4s; }
  body.idle .fab { opacity: 0; pointer-events: none; }
  .error-overlay { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 30; max-width: calc(100vw - 32px); border-radius: 12px; }

  /* ---------- big screen: all 15 matches on one screen (5 × 3), no scrolling ---------- */
  @media (min-width: 900px) and (orientation: landscape) {
    :root { --u: min(1vw, 1.75vh); }
    html, body { height: 100%; overflow: hidden; }
    .board { height: 100vh; height: 100dvh; max-width: none; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: calc(var(--u) * 1.1); padding: calc(var(--u) * 1.5) calc(var(--u) * 2); }
    .d-head { flex-wrap: nowrap; gap: calc(var(--u) * 1.4); }
    .d-logo { width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); }
    .d-titles .eyebrow { font-size: calc(var(--u) * 1); }
    .d-title { font-size: calc(var(--u) * 3.2); }
    .conn { font-size: calc(var(--u) * .9); padding: calc(var(--u) * .45) calc(var(--u) * .9); }
    .now-card { padding: calc(var(--u) * .7) calc(var(--u) * 1.4); gap: calc(var(--u) * 1.3); border-radius: calc(var(--u) * 1.2); }
    .now-card small { font-size: calc(var(--u) * .8); }
    .now-card .nm { font-size: calc(var(--u) * 2.4); }
    .now-card .ck { font-size: calc(var(--u) * 4); padding-left: calc(var(--u) * 1.3); }
    .finder { padding: calc(var(--u) * .5) calc(var(--u) * 1.1); border-radius: calc(var(--u) * 1); }
    .finder label { font-size: calc(var(--u) * .85); }
    .finder select { min-height: calc(var(--u) * 2.9); font-size: max(14px, calc(var(--u) * 1.05)); padding: 0 calc(var(--u) * .9); }
    .finder .summary { font-size: calc(var(--u) * 1); }
    .finder .btn { min-height: calc(var(--u) * 2.9); font-size: calc(var(--u) * .95); }
    .sched { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 3), minmax(0, 1fr)); gap: calc(var(--u) * 1); min-height: 0; }
    .mcard { container-type: size; min-height: 0; gap: 4cqh; padding: calc(var(--u) * 1) calc(var(--u) * 1.1); border-radius: calc(var(--u) * 1.1); }
    .mc-no { font-size: calc(var(--u) * 2); font-size: min(calc(var(--u) * 2.2), 13cqh); }
    .mc-pill { font-size: calc(var(--u) * .8); font-size: min(calc(var(--u) * .85), 6.5cqh); padding: .35em .8em; }
    .mc-teams { flex: 1; min-height: 0; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 3cqh; }
    /* colour word hidden on big screens (dot + footer legend) so long team names fit */
    .mc-team { padding: 0 calc(var(--u) * .7); border-radius: calc(var(--u) * .7); gap: calc(var(--u) * .6); grid-template-columns: auto minmax(0, 1fr) auto; }
    .mc-col { display: none; }
    .mc-name { font-size: calc(var(--u) * 1.15); font-size: min(calc(var(--u) * 1.45), 11cqh); }
    .mc-pts { font-size: calc(var(--u) * 1.7); font-size: min(calc(var(--u) * 2.1), 15cqh); }
    .progress { font-size: calc(var(--u) * 1); }
    .bar { height: calc(var(--u) * .7); }
    .legend { font-size: calc(var(--u) * .95); }
    .event-line { font-size: calc(var(--u) * .9); }
    .foot-links { display: none; }
  }
  @media (max-width: 560px) {
    .d-logo { width: 48px; height: 48px; }
    .d-title { font-size: 26px; }
    .now-card { width: 100%; justify-content: space-between; }
    .finder select { flex: 1 1 100%; min-width: 0; }
  }
</style>
</head>
<body>
<div class="board">
  <header class="d-head">
    <img class="d-logo" src="assets/logo-light.png" alt="GRC logo">
    <div class="d-titles">
      <div class="eyebrow" id="evOrg">Genius Robotics Challenge</div>
      <div class="d-title" id="evTitle">Resource Recovery <span>Schedule</span></div>
    </div>
    <span class="conn" id="conn" data-state="connecting"><i></i><span>Connecting…</span></span>
    <a class="btn watch-live hidden" id="watchLive" href="#" target="_blank" rel="noopener">Watch live</a>
    <a class="now-card" id="nowCard" href="#" aria-label="Jump to the match being played">
      <div><small id="nowLabel">Now playing</small><span class="nm" id="nowMatch">Match 1</span></div>
      <span class="ck" id="clock">03:00</span>
    </a>
  </header>

  <div class="finder">
    <label for="teamFilter">Find your team</label>
    <select class="field" id="teamFilter"><option value="">All teams</option></select>
    <div class="summary" id="summary">Every team plays 6 matches and meets every other team twice.</div>
    <button class="btn small ghost clear hidden" type="button" id="clearFilter">✕ Show all</button>
  </div>

  <main class="sched" id="sched" aria-live="polite"></main>

  <footer class="d-foot">
    <div class="progress"><span id="progressText">0 of 15 matches complete</span><div class="bar"><i id="progressBar"></i></div></div>
    <div class="foot-row">
      <div class="legend">
        <span><i class="dot" style="--c:var(--c-red)"></i>Red · Metals</span>
        <span><i class="dot" style="--c:var(--c-blue)"></i>Blue · Plastics</span>
        <span><i class="dot" style="--c:var(--c-green)"></i>Green · Glass</span>
        <span><i class="dot" style="--c:var(--c-yellow)"></i>Yellow · Paper</span>
      </div>
      <div class="foot-links">
        <a class="btn small ghost" href="display.html">◫ Live standings</a>
      </div>
      <div class="event-line" id="eventLine"></div>
    </div>
  </footer>
</div>

<div class="fab"><button class="btn small" type="button" id="fullBtn" title="Fullscreen (F)">⛶ Fullscreen</button></div>
<div class="banner error error-overlay hidden" id="errorBox"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';
  const G = window.GRC, $ = G.$, esc = G.esc;
  const STORE = 'grc_schedule_team';
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  let d = null;
  let firstRender = true;
  let lastPhase = '';
  let lastScored = new Map();

  // Remember the chosen team: ?team=3 in the link wins, then this device's last choice
  let team = (() => {
    const q = Number(new URLSearchParams(location.search).get('team'));
    if (q >= 1 && q <= G.TEAM_COUNT) return q;
    try { const s = Number(localStorage.getItem(STORE)); if (s >= 1 && s <= G.TEAM_COUNT) return s; } catch (e) {}
    return 0;
  })();

  const E = G.EVENT;
  $('evOrg').textContent = E.org;
  $('evTitle').innerHTML = esc(E.title) + ' <span>Schedule</span>';
  $('eventLine').textContent = [E.tagline, E.date, E.time, E.venue].filter(Boolean).join(' · ');
  document.title = E.title + ' · Match Schedule';

  G.on('status', s => {
    const c = $('conn');
    c.dataset.state = s.state;
    c.querySelector('span').textContent = s.state === 'live' ? 'Live' : s.label;
    $('errorBox').classList.toggle('hidden', !(s.state === 'offline' && s.message));
    $('errorBox').textContent = s.message || '';
  });

  G.on('data', nd => { d = nd; render(); tick(); });

  // ------------------------------------------------------------ team finder
  function fillFilter() {
    const sel = $('teamFilter');
    const opts = '<option value="">All teams</option>' +
      d.teams.slice().sort((a, b) => a.name.localeCompare(b.name)).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
    if (sel.dataset.sig !== opts) { sel.innerHTML = opts; sel.dataset.sig = opts; }
    sel.value = team ? String(team) : '';
  }
  $('teamFilter').addEventListener('change', e => setTeam(Number(e.target.value) || 0));
  $('clearFilter').onclick = () => setTeam(0);
  function setTeam(id) {
    team = id;
    try { if (id) localStorage.setItem(STORE, String(id)); else localStorage.removeItem(STORE); } catch (e) {}
    const url = new URL(location.href);
    if (id) url.searchParams.set('team', id); else url.searchParams.delete('team');
    history.replaceState(null, '', url);
    render();
    if (id) {
      const first = d.matches.find(m => m.team_ids.includes(id) && !m.scores) || d.matches.find(m => m.team_ids.includes(id));
      scrollToMatch(first && first.id);
    }
  }

  function renderSummary() {
    $('clearFilter').classList.toggle('hidden', !team);
    if (!team) { $('summary').innerHTML = 'Every team plays 6 matches and meets every other team twice. Pick your team to highlight its matches.'; return; }
    const mine = d.matches.filter(m => m.team_ids.includes(team));
    const row = G.standings(d).find(r => r.id === team);
    const done = G.scoredCount(d);
    const next = mine.find(m => !m.scores && m.id >= d.state.current_match);
    // how many matches away, counted in running order (extra matches can have gaps in their numbers)
    const away = next ? d.matches.findIndex(m => m.id === next.id) - d.matches.findIndex(m => m.id === d.state.current_match) : 0;
    const nextTxt = !next ? 'All matches played'
      : next.id === d.state.current_match ? '<b>On the field now</b> (' + esc(G.matchName(d, next)) + ')'
      : 'Next: <b>' + esc(G.matchName(d, next)) + '</b>' + (away === 1 ? ' (up next!)' : ' (' + away + ' matches away)');
    $('summary').innerHTML = `<b>${esc(G.teamName(d, team))}</b> plays matches ${mine.map(m => m.extra ? esc(G.matchName(d, m)) : m.id).join(' · ')}. ` +
      `${nextTxt}. ${row.played} of ${row.scheduled} played` +
      (row.played ? ` · <b>${G.formatAvg(row.avg)} avg</b> · best match ${row.best} pts` : '') +
      (done ? ' · ' + ordinal(row.rank) + ' place' : '');
  }

  // ------------------------------------------------------------ cards
  function stateOf(m) {
    const cur = d.state.current_match;
    if (m.id === cur) {
      const p = G.matchPhase(d, m.id);
      return { cls: 'live' + (p.key === 'awaiting' ? ' awaiting' : ''), phase: p.key, label: p.key === 'final' ? '✓ Final' : p.key === 'live' ? 'Now playing' : p.label };
    }
    if (G.isFinal(m)) return { cls: 'final', phase: 'final', label: '✓ Final' };
    if (m.live_scores) return { cls: 'scoring', phase: 'scoring', label: 'Live scoring' };
    const nx = G.adjacentMatch(d, cur, 1);
    if (nx && m.id === nx.id) return { cls: 'next', phase: 'next', label: 'Up next' };
    return { cls: '', phase: 'upcoming', label: m.id < cur ? 'Not scored' : 'Upcoming' };
  }

  function render() {
    lastPhase = G.matchPhase(d, d.state.current_match).key;
    const live = d.state.stream_enabled && d.state.stream_source;
    $('watchLive').classList.toggle('hidden', !live);
    if (live) $('watchLive').href = G.streamWatchUrl(d.state.stream_source);
    fillFilter();
    renderSummary();
    const done = G.scoredCount(d);

    $('sched').innerHTML = d.matches.map(m => {
      const s = stateOf(m);
      const final = G.isFinal(m);
      const shown = G.shownScores(m);            // running +/− score while live scoring, else the final result
      const top = final ? Math.max.apply(null, m.scores) : null;
      const mineCls = team && !m.team_ids.includes(team) ? ' dim' : '';
      const changed = lastScored.has(m.id) && lastScored.get(m.id) !== JSON.stringify(m.scores) && final;
      const rows = m.team_ids.map((t, j) => {
        const c = G.COLORS[m.colors[j]];
        const win = final && m.scores[j] === top && top > 0;
        return `<li class="mc-team${win ? ' win' : ''}${shown && !final ? ' lv' : ''}${team === t ? ' me' : ''}" style="--c:${c.hex}" title="${c.name} robot · ${c.material}">
          <i class="dot"></i><span class="mc-col">${c.name}</span>
          <span class="mc-name">${esc(G.teamName(d, t))}</span>
          <b class="mc-pts">${shown ? shown[j] : ''}</b></li>`;
      }).join('');
      return `<article class="mcard ${s.cls}${m.extra ? ' extra' : ''}${mineCls}${changed ? ' flash' : ''}" id="match-${m.id}" data-phase="${s.phase}">
        <div class="mc-head"><span class="mc-no">${esc(G.matchName(d, m))}</span><span class="mc-pill" data-pill>${s.label}${m.id === d.state.current_match && !final ? ' <span class="t" data-ck></span>' : ''}</span></div>
        <ul class="mc-teams">${rows}</ul>
      </article>`;
    }).join('');
    lastScored = new Map(d.matches.map(m => [m.id, JSON.stringify(m.scores)]));

    const total = d.matches.length;                  // 15 qualifying + any extra matches added by judges
    $('progressText').textContent = done + ' of ' + total + ' matches complete';
    $('progressBar').style.width = (done / total * 100) + '%';
    $('nowMatch').textContent = G.matchName(d, d.state.current_match);
    // big screens: 5 cards per row, as many rows as needed (3 for the 15 qualifying matches)
    $('sched').style.setProperty('--rows', Math.ceil(total / 5));

    if (firstRender) {
      firstRender = false;
      const target = team ? (d.matches.find(m => m.team_ids.includes(team) && !m.scores) || {}).id : d.state.current_match;
      scrollToMatch(target, 'auto');
    }
  }

  function scrollToMatch(id, behavior) {
    const el = id && $('match-' + id);
    // Only matters on phones/tablets; the big-screen layout shows all 15 at once
    if (el && document.documentElement.scrollHeight > window.innerHeight + 40)
      el.scrollIntoView({ block: 'center', behavior: behavior || 'smooth' });
  }
  $('nowCard').addEventListener('click', e => { e.preventDefault(); if (d) scrollToMatch(d.state.current_match); });

  // ------------------------------------------------------------ clock (synced to server time)
  function tick() {
    if (!d) return;
    const rem = G.clockRemaining(d);
    const txt = G.formatTime(rem);
    const running = d.state.clock_running && rem > 0;
    if ($('clock').textContent !== txt) $('clock').textContent = txt;
    const card = $('nowCard');
    card.classList.toggle('running', running);
    card.classList.toggle('danger', running && rem <= 20000);
    card.classList.toggle('done', rem <= 0);
    const p = G.matchPhase(d, d.state.current_match);
    $('nowLabel').textContent = p.key === 'live' ? 'Now playing' : p.key === 'final' ? 'Just finished' : p.key === 'awaiting' ? "Time's up" : 'On the field';
    const pillClock = document.querySelector('[data-ck]');
    if (pillClock) pillClock.textContent = running || (rem > 0 && rem < d.state.clock_duration_ms) ? txt : '';
    if (p.key !== lastPhase) { lastPhase = p.key; render(); }   // e.g. "On deck" → "Now playing" → "Awaiting scores"
  }
  setInterval(tick, 250);

  // ------------------------------------------------------------ fullscreen, idle cursor, wake lock
  const root = document.documentElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) $('fullBtn').classList.add('hidden');
  function toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = root.requestFullscreen || root.webkitRequestFullscreen; if (r) Promise.resolve(r.call(root)).catch(() => {}); }
  }
  $('fullBtn').onclick = toggleFullscreen;
  document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && e.target.tagName !== 'SELECT') toggleFullscreen(); });
  let idleT;
  const wakeUi = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); };
  ['mousemove', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, wakeUi, { passive: true }));
  wakeUi();

  G.keepAwake();
  G.start();
})();
</script>
</body>
</html>
